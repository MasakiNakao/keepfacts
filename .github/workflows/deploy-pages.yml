name: Deploy to GitHub Pages

on:
  # workflow_run executes from the default branch. That keeps the Pages OIDC
  # ref on main (as required by the github-pages environment) while the build
  # below remains cryptographically bound to the successful tag CI run.
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing KeepFacts release tag to deploy (for example vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Non-release CI completions get an isolated group, so a skipped main/PR run
  # cannot cancel a real release deployment that is already in progress.
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main') ||
         (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_branch, 'v'))) &&
        'pages' || format('pages-skipped-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || format('refs/tags/{0}', inputs.release_tag) }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve and verify release tag
        id: release
        env:
          AUTOMATIC_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          AUTOMATIC_RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="v$(node -p "require('./package.json').version")"
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Package version does not produce a valid release tag: $release_tag" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            requested_tag="$AUTOMATIC_RELEASE_TAG"
            verified_sha="$AUTOMATIC_RELEASE_SHA"
          else
            requested_tag="$REQUESTED_RELEASE_TAG"
            verified_sha="$(git rev-parse HEAD)"
          fi
          if [[ "$requested_tag" != "$release_tag" ]]; then
            echo "Requested tag $requested_tag does not match package version $release_tag" >&2
            exit 1
          fi
          if [[ ! "$verified_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release SHA must be a full lowercase Git SHA, received $verified_sha" >&2
            exit 1
          fi

          release_sha="$(git rev-parse "refs/tags/${release_tag}^{commit}")"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$release_sha" != "$checked_out_sha" ]]; then
            echo "Tag $release_tag does not point to checked-out commit $checked_out_sha" >&2
            exit 1
          fi
          if [[ "$verified_sha" != "$checked_out_sha" ]]; then
            echo "Verified CI commit $verified_sha does not match checked-out commit $checked_out_sha" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$checked_out_sha" refs/remotes/origin/main; then
            echo "Release commit $checked_out_sha is not reachable from origin/main" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify release metadata, unit tests, build, and browser tests
        env:
          GITHUB_REF_NAME: ${{ steps.release.outputs.tag }}
          GITHUB_REF_TYPE: tag
          KEEPFACTS_REQUIRE_ORIGIN_MAIN: "true"
          VITE_COMMIT_SHA: ${{ steps.release.outputs.sha }}
        run: npm run check:all
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
