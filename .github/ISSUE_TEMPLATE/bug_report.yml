name: Bug report
description: Report a missed fact, false positive, or interface problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: source
    attributes:
      label: Source text
      description: Use a minimal, non-sensitive example.
    validations:
      required: true
  - type: textarea
    id: rewrite
    attributes:
      label: Rewritten text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Safari, Firefox, Edge, Other]
    validations:
      required: true
