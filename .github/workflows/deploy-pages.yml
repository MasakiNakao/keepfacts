name: Deploy to GitHub Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing KeepFacts release tag to deploy (for example vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve and verify release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="v$(node -p "require('./package.json').version")"
          if [[ -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "$release_tag" ]]; then
            echo "Requested tag $REQUESTED_TAG does not match package version $release_tag" >&2
            exit 1
          fi
          release_sha="$(git rev-parse "${release_tag}^{commit}")"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$release_sha" != "$checked_out_sha" ]]; then
            echo "Tag $release_tag does not point to checked-out commit $checked_out_sha" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify release metadata, unit tests, build, and browser tests
        env:
          GITHUB_REF_NAME: ${{ steps.release.outputs.tag }}
          GITHUB_REF_TYPE: tag
          VITE_COMMIT_SHA: ${{ steps.release.outputs.sha }}
        run: npm run check:all
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
