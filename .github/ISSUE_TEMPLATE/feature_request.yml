name: Feature request
description: Suggest a focused fact type or workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What fact-checking problem would this solve?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal example
      description: Show the source, rewrite, and expected result.
    validations:
      required: true
